server.port=${PORT:8089}

# =====================================================================
# CONEXIÓN A SUPABASE POSTGRESQL
# Se usa el Session Pooler IPv4 de Supabase para tu proyecto (jbnmomwocrdjpvzkjeew)
# ya que el host directo db.jbnmomwocrdjpvzkjeew.supabase.co es solo IPv6.
# =====================================================================
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones Hikari ajustado para Supabase
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# =====================================================================
# CONFIGURACIÓN DE CORREO SMTP (Para 2FA, Recuperación y Alertas Login)
# Si configuras tu correo Gmail y Contraseña de Aplicación de 16 letras,
# enviará correos reales. Si se deja vacío, el sistema funciona en modo
# sin envío; los códigos no se muestran salvo configuración explícita local.
# =====================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Credenciales SMTP locales, excluidas de Git.
spring.config.import=optional:file:./.database-local.properties,optional:file:./backend-a365/.database-local.properties,optional:file:./.smtp-local.properties,optional:file:./backend-a365/.smtp-local.properties

# Sesión autenticada del servidor
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=A365SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie

# Correo por HTTPS para Render Free; SMTP sigue siendo el valor local por defecto.
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.brevo.api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:}
app.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
