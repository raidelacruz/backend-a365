# =====================================================================
# CONFIGURACIÓN DE CORREO SMTP (Para 2FA, Recuperación y Alertas Login)
# Si configuras tu correo Gmail y Contraseña de Aplicación de 16 letras,
# enviará correos reales. Si se deja vacío, el sistema funciona en modo
# híbrido mostrando el código/correo en consola y en notificación visual.
# =====================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Credenciales SMTP locales, excluidas de Git.
spring.config.import=optional:file:./.smtp-local.properties,optional:file:./backend-a365/.smtp-local.properties

# Sesión autenticada del servidor
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=A365SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
